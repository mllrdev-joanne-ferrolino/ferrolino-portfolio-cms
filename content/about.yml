content: |
  Hi, I'm **Joanne P. Ferrolino**, a software developer with 5+ years of experience building scalable e-commerce solutions and enterprise integrations. I’m based in **Dumaguete City, Philippines**.

  My core stack includes **C#**, **.NET**, and modern JavaScript frameworks like **Angular** and **Vue.js**. I specialize in API design, cloud deployment on **Microsoft Azure** and **Optimizely DXP**, and delivering production-ready features that drive business value.

  ### What I focus on

  - Clean, maintainable architecture and reliable APIs
  - Scalable e-commerce and enterprise integrations
  - CI/CD pipelines, monitoring, and production stability
  - Clear communication and stakeholder alignment

  ### Professional experience

  - Miller Solutions Development — Software Developer (2021–Present)
  - Miller Solutions Development — Entry-Level Software Developer (2020–2021)

  ### Education

  - Bachelor of Science in Information Technology — Negros Oriental State University (2017)

  If you’d like to collaborate, reach me at **joferrolino0109@gmail.com** or connect on [LinkedIn](https://www.linkedin.com/in/joanne-ferrolino/).
